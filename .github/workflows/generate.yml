name: Generate Nomad Skills

on:
  schedule:
    # Daily at 8 AM UTC — pick up upstream HashiCorp doc updates
    - cron: '0 8 * * *'
  push:
    branches: [main]
    paths:
      - 'generate_skill.py'
      - 'projects.json'
      - 'versions.json'
      - 'templates/**'
      - 'ci/**'
      - '.github/workflows/generate.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force regenerate all versions (ignore cache)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect changes and generate skills
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci/generate_all.py ${{ inputs.force && '--force' || '' }}

      - name: Upload skills as release assets
        if: steps.generate.outputs.releases != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for release_info in ${{ steps.generate.outputs.releases }}; do
            version=$(echo "$release_info" | cut -d: -f1)
            zip_path=$(echo "$release_info" | cut -d: -f2)
            tag="$version"

            cp "$zip_path" "nomad-best-practices.zip"

            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$tag" "nomad-best-practices.zip" \
              --title "Nomad ${version} Skill" \
              --notes "Auto-generated Claude Code skill for HashiCorp Nomad ${version}.

          Generated from official Nomad ${version} documentation in \`hashicorp/web-unified-docs\`.

          ## Install

          \`\`\`bash
          gh release download ${tag} -R tcivie/nomad-skill-gen
          unzip nomad-best-practices.zip -d ~/.claude/skills/
          \`\`\`

          Or pull into your Claude Code plugin's skills/ directory."
          done

      - name: Commit updated versions.json
        if: steps.generate.outputs.versions_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git diff --cached --quiet || git commit -m "chore: update versions.json"
          git push
